[package]
name = "equinox-vault"
version = "0.2.0"
edition = "2021"
description = "Shielded B2B Escrow and Timelocked Settlement on Stellar Soroban"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "21.0.0", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
